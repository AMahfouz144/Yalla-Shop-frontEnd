<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-in fade-in duration-200">
  
  <!-- Modal Content -->
  <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
    <!-- Header -->
    <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
      <h2 class="text-xl font-bold text-slate-800 tracking-tight font-headline">Create Promo Code</h2>
      <button type="button" class="text-slate-400 hover:text-rose-600 transition-colors p-1 rounded-full hover:bg-rose-50" (click)="onClose()">
        <span class="material-symbols-outlined text-2xl">close</span>
      </button>
    </div>

    <!-- Scrollable Body -->
    <div class="p-6 overflow-y-auto custom-scrollbar flex-1">
      
      <!-- Toast/Alerts -->
      <div *ngIf="successMessage" class="mb-5 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800 font-medium flex items-center gap-2">
        <span class="material-symbols-outlined text-emerald-600">check_circle</span>
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="mb-5 rounded-xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-800 font-medium flex items-center gap-2">
        <span class="material-symbols-outlined text-rose-600">error</span>
        {{ errorMessage }}
      </div>

      <form [formGroup]="promoForm" (ngSubmit)="onSubmit()" class="space-y-5">
        
        <!-- Code & Auto-Generate -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Promo Code <span class="text-rose-500">*</span></label>
          <div class="flex gap-2">
            <input type="text" formControlName="code" placeholder="e.g. SUMMER24"
              class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 transition-all uppercase"
            />
            <button type="button" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition-colors border border-slate-200 whitespace-nowrap" (click)="generateRandomCode()">
              Auto Generate
            </button>
          </div>
          <p *ngIf="formControls['code'].invalid && formControls['code'].touched" class="mt-1 text-xs text-rose-500">
            Code is required and must be alphanumeric.
          </p>
        </div>

        <!-- Discount Type & Value -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Discount Type <span class="text-rose-500">*</span></label>
            <div class="relative">
              <select formControlName="discountType" class="w-full appearance-none rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer">
                <option value="" disabled selected>Select Type</option>
                <option value="Percentage">Percentage (%)</option>
                <option value="FixedAmount">Fixed Amount ($)</option>
              </select>
              <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Discount Value <span class="text-rose-500">*</span></label>
            <input type="number" formControlName="discountValue" min="0" placeholder="e.g. 15"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 transition-all"
            />
          </div>
        </div>

        <!-- Order Rules -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Min Order Amount</label>
            <input type="number" formControlName="minOrderAmount" min="0" placeholder="e.g. 50"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 transition-all"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Max Usages</label>
            <input type="number" formControlName="maxUsageCount" min="1" placeholder="e.g. 100"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 transition-all"
            />
          </div>
        </div>

        <!-- Dates -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Start Date <span class="text-rose-500">*</span></label>
            <input type="datetime-local" formControlName="startDate"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 transition-all"
            />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">End Date <span class="text-rose-500">*</span></label>
            <input type="datetime-local" formControlName="endDate"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm outline-none focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/20 transition-all"
            />
          </div>
        </div>
        <p *ngIf="promoForm.errors?.['dateInvalid'] && promoForm.touched" class="text-xs text-rose-500 font-medium">
          End date must be greater than start date.
        </p>

      </form>
    </div>

    <!-- Footer Actions -->
    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-3">
      <button type="button" class="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:text-slate-800 hover:bg-slate-200 rounded-xl transition-all" (click)="onClose()" [disabled]="isLoading">
        Cancel
      </button>
      <button type="button" class="px-6 py-2.5 text-sm font-semibold text-white bg-primary hover:bg-primary-container rounded-xl transition-all shadow-sm shadow-primary/30 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" (click)="onSubmit()" [disabled]="promoForm.invalid || isLoading">
        <span *ngIf="isLoading" class="material-symbols-outlined text-sm animate-spin">refresh</span>
        {{ isLoading ? 'Creating...' : 'Create Promo Code' }}
      </button>
    </div>

  </div>
</div>
