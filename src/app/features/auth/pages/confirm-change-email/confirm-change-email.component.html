<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-xl bg-white rounded-2xl shadow-sm border border-gray-100 p-8 md:p-10">
    <div class="flex items-center gap-3 mb-6">
      <span class="material-symbols-outlined text-orange-600 text-[28px]">mark_email_read</span>
      <h1 class="text-2xl font-headline font-bold text-gray-900">Confirm Email Change</h1>
    </div>

    <div *ngIf="isLoading" class="flex items-center gap-3 text-gray-600 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3">
      <span class="w-5 h-5 border-2 border-gray-300 border-t-orange-600 rounded-full animate-spin"></span>
      <span>{{ message }}</span>
    </div>

    <div *ngIf="!isLoading && isSuccess" class="bg-green-50 text-green-700 border border-green-200 rounded-xl p-4 flex items-start gap-3">
      <span class="material-symbols-outlined">check_circle</span>
      <div>
        <p class="font-medium">Success</p>
        <p class="text-sm mt-1">{{ message }}</p>
      </div>
    </div>

    <div *ngIf="!isLoading && !isSuccess" class="bg-red-50 text-red-700 border border-red-200 rounded-xl p-4 flex items-start gap-3">
      <span class="material-symbols-outlined">error</span>
      <div>
        <p class="font-medium">Confirmation Failed</p>
        <p class="text-sm mt-1">{{ message }}</p>
      </div>
    </div>

    <div class="mt-8">
      <a routerLink="/auth/login"
         class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg bg-orange-600 text-white font-medium hover:bg-orange-700 transition-colors">
        Go to Login
      </a>
    </div>
  </div>
</div>
