<div class="bg-background text-on-surface font-body min-h-[calc(100vh-64px)] flex items-center justify-center p-4">
    <div class="bg-surface-container-lowest max-w-md w-full rounded-2xl p-8 md:p-10 shadow-[0_32px_64px_-4px_rgba(44,47,49,0.06)] relative overflow-hidden">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="material-symbols-outlined text-primary text-3xl">key</span>
            </div>
            <h2 class="font-headline text-3xl font-extrabold mb-2 tracking-tight">Forgot Password</h2>
            <p class="text-on-surface-variant text-sm px-4">
                Enter your registered email address to receive a secure password reset link.
            </p>
        </div>

        <div *ngIf="submitSuccess" class="mb-6 rounded-md bg-[#eaf7ee] border border-[#b2e5c0] p-4 text-[#14532d] shadow-sm animate-in fade-in slide-in-from-top-2 duration-300">
            <div class="flex items-start gap-3">
                <span class="material-symbols-outlined text-[#22c55e] mt-0.5">check_circle</span>
                <div class="text-sm">
                    <p class="font-bold mb-1 tracking-tight">Request Sent!</p>
                    <p class="opacity-90 break-words leading-relaxed">{{ submitSuccess }}</p>
                </div>
            </div>
        </div>

        <div *ngIf="submitError" class="mb-6 rounded-md bg-error-container p-4 text-on-error-container shadow-sm border border-error/20 animate-in fade-in slide-in-from-top-2 duration-300">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-error">error</span>
                <p class="text-sm font-medium">{{ submitError }}</p>
            </div>
        </div>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-6" *ngIf="!submitSuccess">
            <div class="space-y-1">
                <label for="userName" class="block text-sm font-bold text-on-surface mb-1">Email Address</label>
                <div class="relative rounded-lg border border-outline-variant/30 bg-surface-container-low focus-within:border-primary focus-within:bg-surface-container-lowest transition-all">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                        <span class="material-symbols-outlined text-on-surface-variant">mail</span>
                    </div>
                    <input type="email" id="userName" formControlName="userName" placeholder="name@example.com" 
                        class="block w-full rounded-lg border-0 py-3.5 pl-12 text-on-surface ring-0 placeholder:text-on-surface-variant/50 focus:ring-0 sm:text-sm bg-transparent outline-none"/>
                </div>
                <div *ngIf="forgotForm.get('userName')?.touched && forgotForm.get('userName')?.invalid" class="text-error text-xs mt-1.5 pl-1">
                    <span *ngIf="forgotForm.get('userName')?.errors?.['required']">Email is required to reset password</span>
                    <span *ngIf="forgotForm.get('userName')?.errors?.['email']">Please enter a valid email address</span>
                </div>
            </div>

            <button type="submit" [disabled]="isSubmitting"
                class="w-full flex justify-center items-center gap-2 py-3.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-gradient-to-tr from-primary to-primary-container hover:shadow-md hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                <span *ngIf="isSubmitting" class="material-symbols-outlined animate-spin">progress_activity</span>
                <span>{{ isSubmitting ? 'Sending Request...' : 'Send Reset Link' }}</span>
                <span class="material-symbols-outlined text-sm" *ngIf="!isSubmitting">send</span>
            </button>
        </form>

        <div class="mt-8 text-center pt-6 border-t border-outline-variant/20">
            <a routerLink="/auth/login" class="inline-flex items-center justify-center gap-2 text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                <span>Back to Login</span>
            </a>
        </div>
    </div>
</div>
