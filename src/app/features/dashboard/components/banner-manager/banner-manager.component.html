<article class="rounded-[28px] border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
    <div class="max-w-2xl">
      <h2 class="font-headline text-2xl font-bold text-slate-900">Banner Management</h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">Upload new banners, preview current placements, and remove outdated creatives using static mock records.</p>
    </div>

    <label class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-2xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-lg transition hover:bg-blue-700">
      <span class="material-symbols-outlined text-[20px]">upload</span>
      Upload New Banner
      <input type="file" multiple class="hidden" (change)="onFileSelection($event)" />
    </label>
  </div>

  <div class="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-3">
    <article
      *ngFor="let banner of banners"
      class="overflow-hidden rounded-[24px] border border-slate-200 bg-white shadow-sm"
    >
      <div class="min-h-[160px] p-5 text-white" [style.background]="banner.accent">
        <div class="flex items-start justify-between gap-4">
          <span class="rounded-full bg-white/15 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em]">{{ banner.placement }}</span>
          <span class="rounded-full bg-white/15 px-3 py-1 text-xs font-semibold">{{ banner.ctaLabel }}</span>
        </div>

        <h3 class="mt-8 max-w-[13rem] font-headline text-2xl font-bold">{{ banner.title }}</h3>
      </div>

      <div class="p-5">
        <div class="flex items-center justify-between gap-3">
          <span class="rounded-full px-3 py-1 text-xs font-semibold" [ngClass]="statusClasses(banner.status)">
            {{ banner.status.label }}
          </span>
          <span class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Manage Current Banners</span>
        </div>

        <p class="mt-4 text-sm leading-6 text-slate-600">{{ banner.summary }}</p>

        <div class="mt-5 flex gap-3">
          <button type="button" class="flex-1 rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600 transition hover:border-blue-200 hover:text-blue-700">
            View
          </button>
          <button
            type="button"
            class="rounded-2xl border border-rose-200 px-4 py-3 text-sm font-semibold text-rose-600 transition hover:bg-rose-50"
            (click)="deleteBanner.emit(banner.id)"
          >
            Delete
          </button>
        </div>
      </div>
    </article>
  </div>
</article>
