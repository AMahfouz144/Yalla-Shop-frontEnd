<article class="rounded-[28px] border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
    <div>
      <h2 class="font-headline text-2xl font-bold text-slate-900">{{ chart.title }}</h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">{{ chart.subtitle }}</p>
    </div>

    <div class="rounded-2xl bg-blue-50 px-4 py-3 text-blue-900">
      <p class="text-xs font-semibold uppercase tracking-[0.28em] text-blue-700">{{ chart.summaryLabel }}</p>
      <p class="mt-2 font-headline text-3xl font-extrabold">{{ chart.summaryValue }}</p>
    </div>
  </div>

  <div class="mt-6 rounded-[24px] bg-slate-950 px-4 py-4">
    <svg [attr.viewBox]="'0 0 ' + chartWidth + ' ' + chartHeight" class="h-72 w-full" preserveAspectRatio="none" role="img" aria-label="Chart placeholder">
      <g *ngFor="let line of gridLines">
        <line
          x1="24"
          [attr.y1]="line"
          [attr.x2]="chartWidth - 24"
          [attr.y2]="line"
          stroke="rgba(255,255,255,0.09)"
          stroke-width="1"
        ></line>
      </g>

      <ng-container *ngIf="chart.chartType === 'line'; else barChart">
        <path [attr.d]="areaPath" fill="rgba(96, 165, 250, 0.16)"></path>
        <path [attr.d]="linePath" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>

        <g *ngFor="let point of renderPoints">
          <circle [attr.cx]="point.x" [attr.cy]="point.y" r="5" fill="#ffffff"></circle>
          <circle [attr.cx]="point.x" [attr.cy]="point.y" r="3" fill="#60a5fa"></circle>
        </g>
      </ng-container>

      <ng-template #barChart>
        <g *ngFor="let point of renderPoints">
          <rect
            [attr.x]="point.x - barWidth() / 2"
            [attr.y]="point.y"
            [attr.width]="barWidth()"
            [attr.height]="chartHeight - padding - point.y"
            rx="10"
            fill="url(#barGradient)"
          ></rect>
        </g>

        <defs>
          <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"></stop>
            <stop offset="100%" stop-color="#1d4ed8"></stop>
          </linearGradient>
        </defs>
      </ng-template>

      <g *ngFor="let point of renderPoints">
        <text [attr.x]="point.x" [attr.y]="chartHeight - 8" fill="rgba(255,255,255,0.65)" font-size="12" text-anchor="middle">
          {{ point.label }}
        </text>
      </g>
    </svg>
  </div>
</article>
