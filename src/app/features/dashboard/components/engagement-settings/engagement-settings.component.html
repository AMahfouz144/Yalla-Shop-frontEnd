<article class="rounded-[28px] border border-slate-200 bg-white p-6 shadow-sm">
  <div>
    <p class="text-xs font-semibold uppercase tracking-[0.3em] text-slate-500">Engagement Toggles</p>
    <h2 class="mt-3 font-headline text-2xl font-bold text-slate-900">Audience communication settings</h2>
  </div>

  <div class="mt-6 space-y-4">
    <article
      *ngFor="let setting of settings"
      class="rounded-[24px] border border-slate-200 bg-slate-50 p-5"
    >
      <div class="flex items-start justify-between gap-4">
        <div>
          <h3 class="font-semibold text-slate-900">{{ setting.label }}</h3>
          <p class="mt-2 text-sm leading-6 text-slate-600">{{ setting.description }}</p>
        </div>

        <button
          type="button"
          role="switch"
          [attr.aria-checked]="setting.enabled"
          class="relative inline-flex h-7 w-14 rounded-full transition"
          [ngClass]="setting.enabled ? 'bg-blue-600' : 'bg-slate-300'"
          (click)="settingChange.emit({ id: setting.id, enabled: !setting.enabled })"
        >
          <span
            class="absolute top-1 h-5 w-5 rounded-full bg-white shadow transition"
            [ngClass]="setting.enabled ? 'left-8' : 'left-1'"
          ></span>
        </button>
      </div>
    </article>
  </div>
</article>
