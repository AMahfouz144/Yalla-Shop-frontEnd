<article class="rounded-[28px] border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-col gap-6 md:flex-row md:items-start md:justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.3em] text-blue-700">Loyalty Balance</p>
      <h2 class="mt-3 font-headline text-3xl font-extrabold text-slate-900">{{ loyalty.pointsLabel }}</h2>
      <p class="mt-2 text-sm text-slate-600">Current tier: <span class="font-semibold text-slate-900">{{ loyalty.tier }}</span></p>
    </div>

    <button
      type="button"
      class="inline-flex items-center justify-center gap-2 rounded-2xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-lg transition hover:bg-blue-700"
      (click)="redeem.emit()"
    >
      <span class="material-symbols-outlined text-[20px]">redeem</span>
      Redeem Points
    </button>
  </div>

  <div class="mt-6 rounded-[24px] bg-slate-950 p-5 text-white">
    <div class="flex items-center justify-between gap-4">
      <div>
        <p class="text-sm text-slate-300">Current Tier</p>
        <p class="mt-2 font-headline text-3xl font-bold">{{ loyalty.tier }}</p>
      </div>
      <div class="rounded-2xl bg-white/10 px-4 py-3 text-right">
        <p class="text-sm text-slate-300">Next Tier</p>
        <p class="mt-2 text-xl font-semibold">{{ loyalty.nextTier }}</p>
      </div>
    </div>
  </div>

  <div class="mt-6 grid gap-3 md:grid-cols-3">
    <article *ngFor="let benefit of loyalty.tierBenefits" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-4 text-sm font-medium text-slate-600">
      {{ benefit }}
    </article>
  </div>
</article>
