<article class="rounded-[28px] border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex items-center justify-between gap-4">
    <div>
      <h2 class="font-headline text-2xl font-bold text-slate-900">Order Processing</h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">Recent seller orders that need fulfillment follow-up.</p>
    </div>
    <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Seller Only</span>
  </div>

  <div class="mt-6 space-y-4">
    <article
      *ngFor="let order of orders"
      class="rounded-[24px] border border-slate-200 bg-slate-50 p-4 transition hover:border-blue-200 hover:bg-white"
    >
      <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
          <div class="flex items-center gap-3">
            <h3 class="font-headline text-lg font-bold text-slate-900">{{ order.id }}</h3>
            <span class="rounded-full px-3 py-1 text-xs font-semibold" [ngClass]="badgeClasses(order.fulfillmentTone)">
              {{ order.fulfillmentStatus }}
            </span>
          </div>
          <p class="mt-2 text-sm text-slate-600">{{ order.customer }} · {{ order.destination }}</p>
        </div>

        <div class="text-left md:text-right">
          <p class="text-sm font-semibold text-slate-900">{{ order.total }}</p>
          <p class="mt-1 text-sm text-slate-500">{{ order.eta }}</p>
        </div>
      </div>

      <button
        type="button"
        class="mt-4 inline-flex items-center gap-2 rounded-2xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-600 transition hover:border-blue-200 hover:text-blue-700"
        (click)="viewOrder.emit(order.id)"
      >
        <span class="material-symbols-outlined text-[19px]">open_in_new</span>
        View Order
      </button>
    </article>
  </div>
</article>
