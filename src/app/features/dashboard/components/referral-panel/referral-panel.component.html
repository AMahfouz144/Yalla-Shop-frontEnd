<article class="rounded-[28px] border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.3em] text-slate-500">Share & Referral</p>
      <h2 class="mt-3 font-headline text-2xl font-bold text-slate-900">Invite your audience</h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">{{ referral.message }}</p>
    </div>
    <span class="rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700">{{ referral.referralCode }}</span>
  </div>

  <div class="mt-6 flex flex-wrap gap-3">
    <button
      *ngFor="let channel of referral.channels"
      type="button"
      class="inline-flex items-center gap-3 rounded-2xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-700 transition hover:border-blue-200 hover:text-blue-700"
      (click)="share.emit(channel.id)"
    >
      <span class="inline-flex h-9 w-9 items-center justify-center rounded-full text-sm font-bold text-white" [style.background]="channel.accent">
        {{ channel.shortLabel | uppercase }}
      </span>
      {{ channel.label }}
    </button>
  </div>

  <div class="mt-6 rounded-[24px] border border-slate-200 bg-slate-50 p-4">
    <label class="text-sm font-semibold text-slate-900">Custom referral link</label>
    <div class="mt-3 flex flex-col gap-3 sm:flex-row">
      <input
        type="text"
        readonly
        [value]="referral.referralLink"
        class="h-12 flex-1 rounded-2xl border border-slate-200 bg-white px-4 text-sm text-slate-600 outline-none"
      />
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 rounded-2xl bg-slate-950 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800"
        (click)="share.emit('copy')"
      >
        <span class="material-symbols-outlined text-[20px]">content_copy</span>
        Copy Link
      </button>
    </div>
  </div>
</article>
