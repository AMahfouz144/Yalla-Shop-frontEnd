<article class="rounded-[24px] border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-lg">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-sm font-medium text-slate-500">{{ card.label }}</p>
      <p class="mt-3 font-headline text-3xl font-extrabold text-slate-900">{{ card.value }}</p>
    </div>

    <span class="rounded-2xl p-3" [ngClass]="iconClasses()">
      <span class="material-symbols-outlined">{{ card.icon }}</span>
    </span>
  </div>

  <div class="mt-6 flex items-center justify-between gap-3">
    <p class="text-sm text-slate-500">{{ card.helperText }}</p>
    <span class="rounded-full px-3 py-1 text-xs font-semibold" [ngClass]="trendClasses()">
      {{ card.trendDirection === 'up' ? '+' : '-' }}{{ card.trend }}%
    </span>
  </div>
</article>
