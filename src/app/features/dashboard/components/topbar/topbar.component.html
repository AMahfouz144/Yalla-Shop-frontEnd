<header class="fixed inset-x-0 top-0 z-30 lg:left-72">
  <div class="border-b border-slate-200/80 bg-white/85 px-4 py-4 backdrop-blur-xl shadow-sm sm:px-6 lg:px-8">
    <div class="flex flex-col gap-4">
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="rounded-2xl border border-slate-200 bg-white p-3 text-slate-700 transition hover:border-blue-200 hover:text-blue-700 lg:hidden"
          (click)="toggleSidebar.emit()"
          aria-label="Open sidebar"
        >
          <span class="material-symbols-outlined">menu</span>
        </button>

        <label class="flex flex-1 items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-500 shadow-sm">
          <span class="material-symbols-outlined text-slate-400">search</span>
          <input
            type="search"
            class="w-full bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
            [placeholder]="searchPlaceholder"
          />
        </label>

        <div class="relative">
          <button
            type="button"
            class="relative rounded-2xl border border-slate-200 bg-white p-3 text-slate-700 transition hover:border-blue-200 hover:text-blue-700"
            (click)="toggleNotifications()"
            aria-label="View notifications"
          >
            <span class="material-symbols-outlined">notifications</span>
            <span
              *ngIf="notificationCount"
              class="absolute -right-1 -top-1 inline-flex min-w-[1.4rem] items-center justify-center rounded-full bg-blue-600 px-1.5 py-0.5 text-[11px] font-bold text-white"
            >
              {{ notificationCount }}
            </span>
          </button>

          <div
            *ngIf="notificationsOpen"
            class="absolute right-0 mt-3 w-80 rounded-[24px] border border-slate-200 bg-white p-4 shadow-2xl"
          >
            <div class="flex items-center justify-between">
              <h2 class="font-headline text-lg font-bold text-slate-900">Notifications</h2>
              <span class="rounded-full bg-blue-50 px-2.5 py-1 text-xs font-semibold text-blue-700">{{ notificationCount }} new</span>
            </div>

            <div class="mt-4 space-y-3">
              <article
                *ngFor="let item of notifications"
                class="rounded-2xl border border-slate-100 px-4 py-3"
                [ngClass]="item.read ? 'bg-slate-50' : 'bg-blue-50/60'"
              >
                <p class="text-sm font-semibold text-slate-900">{{ item.title }}</p>
                <p class="mt-1 text-xs text-slate-500">{{ item.time }}</p>
              </article>
            </div>
          </div>
        </div>

        <div class="relative">
          <button
            type="button"
            class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white px-3 py-2 shadow-sm transition hover:border-blue-200"
            (click)="toggleProfile()"
            aria-label="Open profile menu"
          >
            <img [src]="user.avatarUrl" [alt]="user.name" class="h-10 w-10 rounded-2xl object-cover" />
            <div class="hidden text-left sm:block">
              <p class="text-sm font-semibold text-slate-900">{{ user.name }}</p>
              <p class="text-xs text-slate-500">{{ user.role }}</p>
            </div>
            <span class="material-symbols-outlined text-slate-400">expand_more</span>
          </button>

          <div *ngIf="profileOpen" class="absolute right-0 mt-3 w-72 rounded-[24px] border border-slate-200 bg-white p-4 shadow-2xl">
            <div class="flex items-center gap-3">
              <img [src]="user.avatarUrl" [alt]="user.name" class="h-12 w-12 rounded-2xl object-cover" />
              <div>
                <p class="font-semibold text-slate-900">{{ user.name }}</p>
                <p class="text-sm text-slate-500">{{ user.email }}</p>
              </div>
            </div>

            <div class="mt-4 space-y-2">
              <button type="button" class="flex w-full items-center gap-3 rounded-2xl px-3 py-2 text-left text-sm text-slate-600 transition hover:bg-slate-50">
                <span class="material-symbols-outlined text-[20px]">person</span>
                Profile
              </button>
              <button type="button" class="flex w-full items-center gap-3 rounded-2xl px-3 py-2 text-left text-sm text-slate-600 transition hover:bg-slate-50">
                <span class="material-symbols-outlined text-[20px]">settings</span>
                Settings
              </button>
              <button type="button" class="flex w-full items-center gap-3 rounded-2xl px-3 py-2 text-left text-sm text-rose-600 transition hover:bg-rose-50">
                <span class="material-symbols-outlined text-[20px]">logout</span>
                Sign out
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap gap-2">
        <button
          *ngFor="let mode of modes"
          type="button"
          class="rounded-full px-4 py-2 text-sm font-semibold transition"
          [ngClass]="mode.id === currentMode ? 'bg-blue-600 text-white shadow-lg' : 'bg-white text-slate-600 ring-1 ring-slate-200 hover:text-blue-700 hover:ring-blue-200'"
          (click)="modeChange.emit(mode.id)"
        >
          {{ mode.label }}
        </button>
      </div>
    </div>
  </div>
</header>
