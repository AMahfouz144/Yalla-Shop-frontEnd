<div class="dashboard-shell min-h-screen bg-slate-50 text-slate-900">
  <app-sidebar
    [brand]="shellData.brand"
    [navigation]="shellData.navigation"
    [currentMode]="currentMode"
    [currentUrl]="currentUrl"
    [isOpen]="sidebarOpen"
    (closeSidebar)="onCloseSidebar()"
  ></app-sidebar>

  <div class="min-h-screen lg:pl-72">
    <app-topbar
      [currentMode]="currentMode"
      [modes]="shellData.modes"
      [notificationCount]="shellData.notificationCount"
      [notifications]="shellData.notifications"
      [user]="shellData.user"
      [searchPlaceholder]="shellData.searchPlaceholder"
      (modeChange)="onModeChange($event)"
      (toggleSidebar)="onToggleSidebar()"
    ></app-topbar>

    <main class="px-4 pb-8 pt-28 sm:px-6 lg:px-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
