<section *ngIf="pageData" class="rounded-[28px] border border-slate-200 bg-white/90 p-6 shadow-sm">
  <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
    <div class="max-w-3xl">
      <span class="inline-flex w-fit rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.3em] text-slate-600">
        {{ currentMode | titlecase }} workspace
      </span>
      <h1 class="mt-3 font-headline text-3xl font-extrabold text-slate-900">{{ pageData.title }}</h1>
      <p class="mt-2 text-sm leading-6 text-slate-600">{{ pageData.description }}</p>
    </div>

    <div *ngIf="pageData.heroMetric" class="rounded-2xl bg-slate-950 px-4 py-3 text-white shadow-lg">
      <p class="text-xs uppercase tracking-[0.3em] text-slate-400">{{ pageData.heroLabel }}</p>
      <p class="mt-2 text-2xl font-bold">{{ pageData.heroMetric }}</p>
    </div>
  </div>

  <div *ngIf="feedbackMessage" class="mt-4 rounded-2xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm font-medium text-blue-700">
    {{ feedbackMessage }}
  </div>
</section>

<section *ngIf="pageData?.statCards?.length" class="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-4">
  <app-stat-card *ngFor="let card of pageData?.statCards" [card]="card"></app-stat-card>
</section>

<section *ngIf="pageData?.collectionCards?.length" class="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-3">
  <article
    *ngFor="let card of pageData?.collectionCards"
    class="rounded-[24px] border border-slate-200 bg-white p-5 shadow-sm"
  >
    <div class="flex items-start justify-between gap-4">
      <div class="rounded-2xl bg-blue-50 p-3 text-blue-700">
        <span class="material-symbols-outlined">{{ card.icon }}</span>
      </div>
      <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">
        {{ card.tone }}
      </span>
    </div>

    <h2 class="mt-5 font-headline text-xl font-bold text-slate-900">{{ card.title }}</h2>
    <p class="mt-2 text-2xl font-bold text-slate-900">{{ card.metric }}</p>
    <p class="mt-3 text-sm leading-6 text-slate-600">{{ card.description }}</p>
  </article>
</section>

<section *ngIf="pageData?.chart" class="mt-6">
  <app-chart-card [chart]="pageData!.chart!"></app-chart-card>
</section>

<section *ngIf="pageData?.table" class="mt-6">
  <app-data-table
    [data]="pageData!.table!"
    (primaryAction)="onPrimaryAction()"
    (rowAction)="onRowAction($event)"
  ></app-data-table>
</section>

<section *ngIf="pageData?.banners" class="mt-6">
  <app-banner-manager
    [banners]="pageData!.banners!"
    (upload)="onBannerUpload($event)"
    (deleteBanner)="onBannerDelete($event)"
  ></app-banner-manager>
</section>

<section *ngIf="pageData?.loyalty" class="mt-6 grid gap-6 xl:grid-cols-[1.1fr_0.9fr]">
  <app-loyalty-summary [loyalty]="pageData!.loyalty!" (redeem)="onRedeem()"></app-loyalty-summary>
  <app-tier-progress [loyalty]="pageData!.loyalty!"></app-tier-progress>
</section>

<section *ngIf="pageData?.settings || pageData?.referral" class="mt-6 grid gap-6 xl:grid-cols-[0.95fr_1.05fr]">
  <app-engagement-settings
    *ngIf="pageData?.settings"
    [settings]="pageData!.settings!"
    (settingChange)="onSettingChange($event)"
  ></app-engagement-settings>

  <app-referral-panel
    *ngIf="pageData?.referral"
    [referral]="pageData!.referral!"
    (share)="onShare($event)"
  ></app-referral-panel>
</section>
